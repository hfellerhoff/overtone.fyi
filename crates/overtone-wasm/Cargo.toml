[package]
name = "overtone-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the overtone.fyi analysis engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
overtone-core = { path = "../overtone-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
